<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ship Visit Report</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
// ---- Submitted Reports archive ----
const REPORTS_KEY='svr_submitted_reports';
function readReports(){try{return JSON.parse(localStorage.getItem(REPORTS_KEY)||'[]')}catch(e){return []}}
function writeReports(list){localStorage.setItem(REPORTS_KEY,JSON.stringify(list))}
function snapshotReport(){return {id:Date.now().toString(),meta:{...meta},state:JSON.parse(JSON.stringify(state)),submittedAt:new Date().toISOString()}}
function submitReport(){
  const reports=readReports();
  const existing=reports.findIndex(r=>r.meta.ship===meta.ship && r.meta.dateOn===meta.dateOn && r.meta.reviewer===meta.reviewer);
  const item=snapshotReport();
  if(existing>=0) item.id=reports[existing].id;
  if(existing>=0) reports[existing]=item; else reports.unshift(item);
  writeReports(reports);
  alert('Report submitted successfully. It is now available under Submitted Reports.');
}
function showScreen(id){['start','checklist','summary','submitted'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function renderSubmittedReports(){
  const wrap=document.getElementById('reportList'), reports=readReports();
  if(!reports.length){wrap.innerHTML='<div class="empty-reports">No submitted reports yet.</div>';return;}
  wrap.innerHTML=reports.map((r,i)=>{
    const m=r.meta||{};
    return `<div class="report-card"><h3>${esc(m.ship||'Unnamed Ship')}</h3><div class="report-meta"><b>Date:</b> ${esc(m.dateOn||'')} ${m.dateOff?'→ '+esc(m.dateOff):''}<br><b>Reviewer:</b> ${esc(m.reviewer||'Reviewer')}<br><b>Submitted:</b> ${new Date(r.submittedAt).toLocaleString()}</div><div class="report-actions"><button class="open" data-open-report="${r.id}">Open Report</button><button data-download-report="${r.id}">Save PDF</button></div></div>`;
  }).join('');
  wrap.querySelectorAll('[data-open-report]').forEach(btn=>btn.onclick=()=>openSubmitted(btn.dataset.openReport));
  wrap.querySelectorAll('[data-download-report]').forEach(btn=>btn.onclick=()=>downloadSubmitted(btn.dataset.downloadReport));
}
function restoreReport(r){
  meta={...r.meta}; currentReviewer=meta.reviewer||'Reviewer';
  Object.keys(state).forEach(k=>{ if(r.state&&r.state[k]) state[k]=r.state[k]; });
  document.getElementById('ship').value=meta.ship||''; document.getElementById('dateOn').value=meta.dateOn||''; document.getElementById('dateOff').value=meta.dateOff||''; document.getElementById('reviewer').value=meta.reviewer||'';
  document.getElementById('hdrShip').textContent=(meta.ship||'').toUpperCase(); document.getElementById('hdrReviewer').value=currentReviewer; document.getElementById('sumTitle').textContent=meta.ship||'';
  renderSections(); showScreen('checklist');
}
function openSubmitted(id){const r=readReports().find(x=>x.id===id);if(!r)return;restoreReport(r)}
function downloadSubmitted(id){const r=readReports().find(x=>x.id===id);if(!r)return;restoreReport(r);setTimeout(()=>{buildSummary();showScreen('summary');setTimeout(makePdf,60)},50)}
document.getElementById('submittedBtn').onclick=()=>{renderSubmittedReports();showScreen('submitted')};
document.getElementById('reportsHomeBtn').onclick=()=>showScreen('start');
document.getElementById('submitBtn').onclick=submitReport;
document.getElementById('submitFromSummary').onclick=submitReport;

</script>
<style>

.section{border-bottom:1px solid var(--vv-line)}.section-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer}.section-head h2{font-size:14.5px;margin:0;color:var(--vv-squid);font-weight:700}.section-count{font-size:12px;color:var(--vv-gray);font-weight:600}.chevron{width:9px;height:9px;border-right:2px solid var(--vv-squid);border-bottom:2px solid var(--vv-squid);transform:rotate(45deg)}.section.open .chevron{transform:rotate(-135deg)}.section-body{display:none;padding:0 20px 14px}.section.open .section-body{display:block}
.item{padding:12px 0;border-top:1px solid var(--vv-line)}.item:first-child{border-top:none}.item-row{display:flex;align-items:flex-start;gap:11px}.check-btn{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--vv-gray);background:#fff;cursor:pointer;position:relative;margin-top:1px}.check-btn.checked{background:var(--vv-red);border-color:var(--vv-red)}.check-btn.checked:after{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg)}.item-text{flex:1;font-size:14.5px;line-height:1.4}.item-actions{display:flex;gap:6px}.icon-btn{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--vv-line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--vv-squid);padding:0}.icon-btn.active{background:var(--vv-squid);color:#fff}.icon-btn svg{width:15px;height:15px}.item-extra{margin-top:10px;margin-left:35px}.item-extra textarea{width:100%;min-height:52px;padding:8px 10px;border:1.5px solid var(--vv-line);border-radius:7px;font-size:13.5px;resize:vertical}.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.thumb{position:relative;width:64px;height:64px;border-radius:7px;overflow:hidden;border:1px solid var(--vv-line)}.thumb img{width:100%;height:100%;object-fit:cover}.thumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(27,27,27,.75);color:#fff;border:none;cursor:pointer}.comment{background:var(--vv-bg);border-radius:7px;padding:8px 10px;font-size:13px;line-height:1.4;margin-bottom:6px}.comment b{color:var(--vv-squid);font-size:12px}.comment-row{display:flex;gap:8px;align-items:flex-end}.comment-row textarea{flex:1;min-height:44px}.btn-add{background:var(--vv-squid);color:#fff;border:0;border-radius:7px;padding:0 14px;height:44px;font-weight:700}.footer-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--vv-line);padding:14px 20px;box-shadow:0 -6px 16px rgba(0,0,0,.04)}
.stat-row{display:flex;gap:10px;margin:16px 0}.stat{flex:1;background:var(--vv-bg);border-top:3px solid var(--vv-red);border-radius:6px;padding:10px 12px}.stat .n{font-size:22px;font-weight:800;color:var(--vv-near-black)}.stat .l{font-size:10.5px;font-weight:700;color:var(--vv-gray);text-transform:uppercase}.summary h2{color:var(--vv-squid);font-size:15px;margin:22px 0 8px}.summary textarea{width:100%;font-size:14px;line-height:1.55;border:1.5px solid var(--vv-line);border-radius:8px;padding:12px;resize:vertical}.hidden{display:none!important}.note{font-size:11px;color:var(--vv-gray);background:var(--vv-bg);padding:9px 10px;border-radius:7px;margin-bottom:10px}.reviewer{display:flex;gap:8px;align-items:center;margin-top:10px}.reviewer label{font-size:10px;color:rgba(255,255,255,.75);font-weight:700}.reviewer input{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;padding:5px 8px}.loading{text-align:center;padding:40px;color:var(--vv-gray)}

.home-icons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.home-icon{border:1.5px solid var(--vv-line);background:#fff;border-radius:10px;padding:16px 12px;text-align:left;color:var(--vv-squid);cursor:pointer;min-height:120px}.home-icon:hover{border-color:var(--vv-squid)}.home-icon-symbol{display:block;font-size:28px;font-weight:700;margin-bottom:8px}.home-icon strong{display:block;font-family:Poppins,Arial,sans-serif;font-size:13px}.home-icon small{display:block;color:var(--vv-gray);font-size:11px;margin-top:5px}.report-card{border:1.5px solid var(--vv-line);border-radius:10px;padding:14px;margin-bottom:10px;background:#fff}.report-card h3{margin:0 0 6px;color:var(--vv-squid);font-size:15px}.report-meta{font-size:12px;color:var(--vv-gray);line-height:1.5}.report-actions{display:flex;gap:8px;margin-top:10px}.report-actions button{flex:1;padding:9px 10px;border-radius:7px;font-weight:700;cursor:pointer;font-size:12px;border:1.5px solid var(--vv-squid);background:#fff;color:var(--vv-squid)}.report-actions .open{background:var(--vv-squid);color:#fff}.empty-reports{text-align:center;color:var(--vv-gray);padding:40px 10px}

@media print{body{background:#fff}.app{max-width:none;box-shadow:none}.footer-bar,.home-icons,#start{display:none!important}.band{print-color-adjust:exact;-webkit-print-color-adjust:exact}.summary{padding-bottom:20px}.section{break-inside:avoid}.thumb{width:110px;height:110px}}
</style></head><body><div class="app" id="app">
<div id="start"><div class="band"><div class="eyebrow">— VIRGIN VOYAGES</div><h1>Ship Visit Report</h1><p class="sub">Culinary, Bar, Restaurant, Procurement & Sanitation</p></div><div class="start">
<div class="field"><label>Ship</label><input id="ship" list="ships" placeholder="Select or type ship"><datalist id="ships"><option>Scarlet Lady</option><option>Valiant Lady</option><option>Resilient Lady</option><option>Brilliant Lady</option></datalist></div>
<div class="field"><label>Date On</label><input type="date" id="dateOn"></div><div class="field"><label>Date Off</label><input type="date" id="dateOff"></div><div class="field"><label>Review By</label><input id="reviewer" placeholder="Reviewer name"></div>
<div class="home-icons">
  <button class="home-icon" id="startBtn"><span class="home-icon-symbol">＋</span><strong>New Ship Visit</strong><small>Start a new report</small></button>
  <button class="home-icon" id="submittedBtn"><span class="home-icon-symbol">▣</span><strong>Submitted Reports</strong><small>Open completed reports</small></button>
</div></div></div>
<div id="checklist" class="hidden"><div class="band compact"><div class="eyebrow" id="hdrShip"></div><h1>Ship Visit Report</h1><div class="reviewer"><label>REVIEW BY</label><input id="hdrReviewer"></div></div><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="fill" style="width:0%"></div></div><div class="progress-label" id="progress">0 of 0 points reviewed</div></div><div id="sections"></div><div class="footer-bar"><button class="btn-primary" id="summaryBtn">Generate Summary</button><div style="height:8px"></div><button class="btn-secondary" id="submitBtn">Submit Report</button></div></div>
<div id="summary" class="hidden"><div class="band compact"><div class="eyebrow">— SUMMARY</div><h1 id="sumTitle"></h1></div><div class="summary"><div class="stat-row" id="stats"></div><h2>Overall Summary</h2><textarea id="overall" rows="6"></textarea><div id="sumSections"></div></div><div class="footer-bar"><button class="btn-primary" id="pdfBtn">Save / Download PDF</button><div style="height:8px"></div><button class="btn-secondary" id="printBtn">Print Report</button><div style="height:8px"></div><button class="btn-secondary" id="submitFromSummary">Submit Report</button><div style="height:8px"></div><button class="btn-secondary" id="backBtn">Back to Checklist</button></div></div>
<div id="submitted" class="hidden"><div class="band compact"><div class="eyebrow">— REPORTS</div><h1>Submitted Reports</h1><p class="sub">Completed ship visit reports saved on this device.</p></div><div class="summary" id="reportList"></div><div class="footer-bar"><button class="btn-secondary" id="reportsHomeBtn">Back to New Report</button></div></div>
</div>
<script>
const SECTIONS=[
{id:'culinary',title:'Culinary',items:[
'All recipe tablets in place in the venues','All recipes followed / food quality in the venues','All set ups FOH followed as per the latest SOP','Tasting spoons available in the kitchens','All equipment in place and in working order','Missing item lists updated and communicated with Procurement','Food cost discussions','Walk-in freezers not being overloaded','Proper explanation of the Treat Yourself program','Matrix for The Galley followed up','Checking the Sailor flow of the restaurants','Review all Hours of Operation','Checking the quality of Ship Eats','Quality of the Treat Yourself dishes','Galley walk-up manning in place / SOP being followed','Review EXC, EXSC, CDC and SC positions','Overtime discussion for the ship','Review promotion / step-up file and follow-up','Conducted a crew round table','Appreciation of the Culinary crew','Uniforms for the Culinary crew','Shoe wear for the Culinary crew','Morning meetings in place','Meetings held with F&B Director / team','Waiter knowledge and waiter meeting / tasting','Overall food cost budget met','Galley equipment budget met','Budget meeting conducted','Cost reduction feedback','Galley fire safety training in place for all culinary crew','Monthly training file checking and regularity of trainings','Attendance of trainings']},
{id:'bar',title:'Bar',note:'No dedicated Bar checklist lines were included in the supplied template. The items below use shared operational controls that are present in the template.',items:[
'All set ups FOH followed as per the latest SOP','All equipment in place and in working order','Missing item lists updated and communicated with Procurement','Review all Hours of Operation','Manning levels reviewed','Overtime discussion for the ship','Conducted a crew round table','Morning meetings in place','Meetings held with F&B Director / team','Waiter / service knowledge and tasting reviewed','Budget meeting conducted','Cost reduction feedback','All SOPs followed as per VMS','Review previous report findings / repeat findings']},
{id:'restaurant',title:'Restaurant',items:[
'All recipe tablets in place in the venues','All recipes followed / food quality in the venues','All set ups FOH followed as per the latest SOP','Checking the Sailor flow of the restaurants','Review all Hours of Operation','Checking the quality of Ship Eats','Quality of the Treat Yourself dishes','Waiter knowledge and waiter meeting / tasting','Variety of the menu','Production meeting in place','Cleanliness in The Kitchen Table area','Labels in The Kitchen Table followed up','Proper cooking methods used for the crew','Closing meeting discussing inspection','Previous reports reviewed / repeat findings']},
{id:'procurement',title:'Procurement',items:[
'Future orders','All items stored properly','All ERP templates followed','Fruit and Vegetables rooms / FIFO in place','All Fruit and Vegetable boxes maintained','Deck 2 galley equipment inventory done as per SOP','Proper storing of flagged items (caviar)','Expiry, none and slow-moving list followed up','Conduct a spot check','Meat ordering sheet and proper charging in place','Butcher amounts for venues / Kitchen Table followed up','Chargeables charging properly followed up','Chargeable tracker filled in correctly','Proper storage of fresh fish and seafood','All missing item lists communicated with Procurement','Storage and thawing procedures followed']},
{id:'sanitation',title:'Sanitation',items:[
'Shellfish logs in place','Cooling logs in place','Updated and approved time-control plans','3-bucket system in place with sanitation checking','Inspections done properly','Conducted inspections within the inspection grid','Findings from inspections properly followed up','Fridge thermometers in place','Food thermometers in place and used','Cleanliness and storage in Butcher shop and walk-in rooms','Cleanliness in The Kitchen Table area','All SOPs followed as per VMS','Pre-shift equipment checks completed']}
];
const state={}; SECTIONS.forEach(s=>s.items.forEach((t,i)=>state[s.id+'__'+i]={checked:false,comments:[],photos:[]}));
let meta={ship:'',dateOn:'',dateOff:'',reviewer:''};let currentReviewer='Reviewer';
const key=k=>'svr_'+k; const ICON_CAMERA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.3"/></svg>';const ICON_NOTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v13l-4 4H4z"/><path d="M8 9h8M8 13h5"/></svg>';
function save(){localStorage.setItem(key('meta'),JSON.stringify(meta));localStorage.setItem(key('state'),JSON.stringify(state));}
function load(){try{let m=JSON.parse(localStorage.getItem(key('meta'))||'null'),s=JSON.parse(localStorage.getItem(key('state'))||'null');if(m){meta=m;return true}if(s){Object.assign(state,s);return true}}catch(e){}return false}
function renderSections(){const wrap=document.getElementById('sections');wrap.innerHTML='';SECTIONS.forEach((sec,si)=>{const el=document.createElement('div');el.className='section'+(si===0?' open':'');el.innerHTML=`<div class="section-head"><h2>${sec.title}</h2><div style="display:flex;gap:10px;align-items:center"><span class="section-count" id="count-${sec.id}"></span><span class="chevron"></span></div></div><div class="section-body"></div>`;wrap.appendChild(el);el.querySelector('.section-head').onclick=()=>el.classList.toggle('open');const body=el.querySelector('.section-body');if(sec.note){const n=document.createElement('div');n.className='note';n.textContent=sec.note;body.appendChild(n)}sec.items.forEach((text,i)=>{const k=sec.id+'__'+i;const item=document.createElement('div');item.className='item';item.id='item-'+k;item.innerHTML=`<div class="item-row"><button class="check-btn" data-k="${k}"></button><div class="item-text">${text}</div><div class="item-actions"><button class="icon-btn note-btn" data-k="${k}">${ICON_NOTE}</button><button class="icon-btn photo-btn" data-k="${k}">${ICON_CAMERA}</button></div></div><div class="item-extra hidden" id="extra-${k}"><div id="comments-${k}"></div><div class="comment-row"><textarea id="input-${k}" placeholder="Add a comment"></textarea><button class="btn-add" data-k="${k}">Add</button></div><div class="thumbs" id="thumbs-${k}"></div><input class="hidden" type="file" accept="image/*" capture="environment" id="file-${k}"></div>`;body.appendChild(item)})});bind();refresh()}
function bind(){document.querySelectorAll('.check-btn').forEach(b=>b.onclick=()=>{let k=b.dataset.k;state[k].checked=!state[k].checked;refresh();save()});document.querySelectorAll('.note-btn').forEach(b=>b.onclick=()=>document.getElementById('extra-'+b.dataset.k).classList.toggle('hidden'));document.querySelectorAll('.photo-btn').forEach(b=>b.onclick=()=>document.getElementById('file-'+b.dataset.k).click());document.querySelectorAll('.btn-add').forEach(b=>b.onclick=()=>{let k=b.dataset.k,ta=document.getElementById('input-'+k),t=ta.value.trim();if(!t)return;state[k].comments.push({name:currentReviewer,text:t,ts:Date.now()});ta.value='';renderComments(k);save();document.getElementById('extra-'+k).classList.remove('hidden')});document.querySelectorAll('input[type=file]').forEach(inp=>inp.onchange=e=>photo(e,inp.dataset.k||inp.id.replace('file-','')));}
function refresh(){let total=0,checked=0;SECTIONS.forEach(s=>{let c=0;s.items.forEach((_,i)=>{total++;let k=s.id+'__'+i;if(state[k].checked)c++;const btn=document.querySelector('.check-btn[data-k="'+k+'"]');if(btn)btn.classList.toggle('checked',state[k].checked);renderComments(k);renderPhotos(k);});let ce=document.getElementById('count-'+s.id);if(ce)ce.textContent=c+'/'+s.items.length;checked+=c});let pct=total?Math.round(checked/total*100):0;document.getElementById('fill').style.width=pct+'%';document.getElementById('progress').textContent=checked+' of '+total+' points reviewed'}
function renderComments(k){let w=document.getElementById('comments-'+k);if(!w)return;w.innerHTML=(state[k].comments||[]).map(c=>`<div class="comment"><b>${esc(c.name)}:</b> ${esc(c.text)}</div>`).join('');if((state[k].comments||[]).length)document.getElementById('extra-'+k).classList.remove('hidden')}
function photo(e,k){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{state[k].photos.push(ev.target.result);renderPhotos(k);document.getElementById('extra-'+k).classList.remove('hidden');save()};r.readAsDataURL(f);e.target.value=''}
function renderPhotos(k){let w=document.getElementById('thumbs-'+k);if(!w)return;w.innerHTML='';(state[k].photos||[]).forEach((src,i)=>{let d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${src}"><button class="rm">×</button>`;d.querySelector('.rm').onclick=()=>{state[k].photos.splice(i,1);renderPhotos(k);save()};w.appendChild(d)})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildSummary(){let total=0,checked=0,photos=0;SECTIONS.forEach(s=>s.items.forEach((_,i)=>{let x=state[s.id+'__'+i];total++;if(x.checked)checked++;photos+=x.photos.length}));document.getElementById('stats').innerHTML=`<div class="stat"><div class="n">${checked}/${total}</div><div class="l">Points Confirmed</div></div><div class="stat"><div class="n">${photos}</div><div class="l">Photos</div></div>`;document.getElementById('overall').value=`Ship visit report for ${meta.ship}, ${meta.dateOn||''} to ${meta.dateOff||''}, reviewed by ${meta.reviewer}. ${checked} of ${total} review points were confirmed.`;let w=document.getElementById('sumSections');w.innerHTML='';SECTIONS.forEach(s=>{let c=s.items.filter((_,i)=>state[s.id+'__'+i].checked).length;let flagged=s.items.filter((_,i)=>!state[s.id+'__'+i].checked);let d=document.createElement('div');d.innerHTML=`<h2>${s.title}</h2><textarea rows="4">${c} of ${s.items.length} points confirmed. ${flagged.length? 'Follow-up needed on: '+flagged.join('; '):'No unchecked points.'}</textarea>`;w.appendChild(d)})}
function makePdf(){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),m=42;let y=84;function head(t){doc.setFillColor(60,16,83);doc.rect(0,0,W,66,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('— VIRGIN VOYAGES',m,25);doc.setFontSize(16);doc.text(t,m,47);y=86}function footer(){doc.setFillColor(27,27,27);doc.rect(0,H-24,W,24,'F');doc.setTextColor(255,255,255);doc.setFontSize(8);doc.setFont('helvetica','normal');doc.text('INTERNAL USE ONLY',m,H-9);doc.text(`${meta.ship}  •  ${meta.dateOn||''}`,W-m,H-9,{align:'right'})}function space(h){if(y+h>H-38){footer();doc.addPage();head('Ship Visit Report')}}function lines(txt,size,max){doc.setFont('helvetica','normal');doc.setFontSize(size);doc.setTextColor(55,55,55);return doc.splitTextToSize(txt,max)};
head('Ship Visit Report');doc.setTextColor(27,27,27);doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(`Ship: ${meta.ship}`,m,y);y+=16;doc.text(`Date On: ${meta.dateOn||''}`,m,y);y+=16;doc.text(`Date Off: ${meta.dateOff||''}`,m,y);y+=16;doc.text(`Review By: ${meta.reviewer}`,m,y);y+=24;doc.setTextColor(225,10,10);doc.setFontSize(9);let total=0,checked=0,photoTotal=0;SECTIONS.forEach(s=>s.items.forEach((_,i)=>{total++;let x=state[s.id+'__'+i];if(x.checked)checked++;photoTotal+=(x.photos||[]).length}));doc.text(`${checked} / ${total} POINTS CONFIRMED   •   ${photoTotal} PHOTOS`,m,y);y+=22;
doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(60,16,83);doc.text('Overall Summary',m,y);y+=16;lines(document.getElementById('overall').value,10.5,W-m*2).forEach(l=>{space(14);doc.text(l,m,y);y+=14});y+=8;
SECTIONS.forEach((s,si)=>{space(28);doc.setDrawColor(225,10,10);doc.line(m,y,m+38,y);y+=13;doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(60,16,83);doc.text(s.title,m,y);y+=16;const ta=document.querySelectorAll('#sumSections textarea')[si];lines(ta?ta.value:'',10.5,W-m*2).forEach(l=>{space(14);doc.setFont('helvetica','normal');doc.setTextColor(55,55,55);doc.text(l,m,y);y+=14});y+=5;
s.items.forEach((text,i)=>{let x=state[s.id+'__'+i];space(14);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...(x.checked?[80,80,80]:[225,10,10]));doc.text(x.checked?'[x]':'[ ]',m,y);doc.setFont('helvetica','normal');doc.setTextColor(60,60,60);let ls=lines(text,9.3,W-m*2-24);ls.forEach((l,j)=>{space(12);doc.text(l,m+21,y);if(j<ls.length-1)y+=12});y+=11;
(x.comments||[]).forEach(c=>{space(12);doc.setFont('helvetica','italic');doc.setFontSize(9);doc.setTextColor(120,120,120);lines('— '+c.name+': '+c.text,9,W-m*2-24).forEach(l=>{doc.text(l,m+21,y);y+=12})});
(x.photos||[]).forEach(src=>{if(!src)return;space(170);try{doc.addImage(src,'JPEG',m+21,y,150,150);y+=158}catch(e){console.error('image add failed',e)}});y+=2})});
footer();
const fn=`Ship_Visit_Report_${(meta.ship||'Ship').replace(/\s+/g,'_')}_${meta.dateOn||'date'}.pdf`;doc.save(fn);}


document.getElementById('startBtn').onclick=()=>{meta.ship=document.getElementById('ship').value.trim()||'Unnamed Ship';meta.dateOn=document.getElementById('dateOn').value;meta.dateOff=document.getElementById('dateOff').value;meta.reviewer=document.getElementById('reviewer').value.trim()||'Reviewer';currentReviewer=meta.reviewer;document.getElementById('hdrShip').textContent=meta.ship.toUpperCase();document.getElementById('hdrReviewer').value=currentReviewer;document.getElementById('sumTitle').textContent=meta.ship;document.getElementById('start').classList.add('hidden');document.getElementById('checklist').classList.remove('hidden');renderSections();save();window.scrollTo(0,0)};
document.getElementById('summaryBtn').onclick=()=>{buildSummary();document.getElementById('checklist').classList.add('hidden');document.getElementById('summary').classList.remove('hidden');window.scrollTo(0,0)};
document.getElementById('backBtn').onclick=()=>{document.getElementById('summary').classList.add('hidden');document.getElementById('checklist').classList.remove('hidden')};document.getElementById('hdrReviewer').onchange=e=>{currentReviewer=e.target.value.trim()||meta.reviewer;meta.reviewer=currentReviewer;save()};document.getElementById('pdfBtn').onclick=makePdf;document.getElementById('printBtn').onclick=()=>{buildSummary();setTimeout(()=>window.print(),60)};

// ---- Submitted Reports archive ----
const REPORTS_KEY='svr_submitted_reports';
function readReports(){try{return JSON.parse(localStorage.getItem(REPORTS_KEY)||'[]')}catch(e){return []}}
function writeReports(list){localStorage.setItem(REPORTS_KEY,JSON.stringify(list))}
function snapshotReport(){return {id:Date.now().toString(),meta:{...meta},state:JSON.parse(JSON.stringify(state)),submittedAt:new Date().toISOString()}}
function submitReport(){
  const reports=readReports();
  const existing=reports.findIndex(r=>r.meta.ship===meta.ship && r.meta.dateOn===meta.dateOn && r.meta.reviewer===meta.reviewer);
  const item=snapshotReport();
  if(existing>=0) item.id=reports[existing].id;
  if(existing>=0) reports[existing]=item; else reports.unshift(item);
  writeReports(reports);
  alert('Report submitted successfully. It is now available under Submitted Reports.');
}
function showScreen(id){['start','checklist','summary','submitted'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function renderSubmittedReports(){
  const wrap=document.getElementById('reportList'), reports=readReports();
  if(!reports.length){wrap.innerHTML='<div class="empty-reports">No submitted reports yet.</div>';return;}
  wrap.innerHTML=reports.map((r,i)=>{
    const m=r.meta||{};
    return `<div class="report-card"><h3>${esc(m.ship||'Unnamed Ship')}</h3><div class="report-meta"><b>Date:</b> ${esc(m.dateOn||'')} ${m.dateOff?'→ '+esc(m.dateOff):''}<br><b>Reviewer:</b> ${esc(m.reviewer||'Reviewer')}<br><b>Submitted:</b> ${new Date(r.submittedAt).toLocaleString()}</div><div class="report-actions"><button class="open" data-open-report="${r.id}">Open Report</button><button data-download-report="${r.id}">Save PDF</button></div></div>`;
  }).join('');
  wrap.querySelectorAll('[data-open-report]').forEach(btn=>btn.onclick=()=>openSubmitted(btn.dataset.openReport));
  wrap.querySelectorAll('[data-download-report]').forEach(btn=>btn.onclick=()=>downloadSubmitted(btn.dataset.downloadReport));
}
function restoreReport(r){
  meta={...r.meta}; currentReviewer=meta.reviewer||'Reviewer';
  Object.keys(state).forEach(k=>{ if(r.state&&r.state[k]) state[k]=r.state[k]; });
  document.getElementById('ship').value=meta.ship||''; document.getElementById('dateOn').value=meta.dateOn||''; document.getElementById('dateOff').value=meta.dateOff||''; document.getElementById('reviewer').value=meta.reviewer||'';
  document.getElementById('hdrShip').textContent=(meta.ship||'').toUpperCase(); document.getElementById('hdrReviewer').value=currentReviewer; document.getElementById('sumTitle').textContent=meta.ship||'';
  renderSections(); showScreen('checklist');
}
function openSubmitted(id){const r=readReports().find(x=>x.id===id);if(!r)return;restoreReport(r)}
function downloadSubmitted(id){const r=readReports().find(x=>x.id===id);if(!r)return;restoreReport(r);setTimeout(()=>{buildSummary();showScreen('summary');setTimeout(makePdf,60)},50)}
document.getElementById('submittedBtn').onclick=()=>{renderSubmittedReports();showScreen('submitted')};
document.getElementById('reportsHomeBtn').onclick=()=>showScreen('start');
document.getElementById('submitBtn').onclick=submitReport;
document.getElementById('submitFromSummary').onclick=submitReport;

</script></body></html>
